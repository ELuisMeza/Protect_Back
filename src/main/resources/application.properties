spring.application.name=protec

# Conexión a la Base de Datos
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari (Neon recicla conexiones idle; pool pequeño y lifetime < timeout del servidor)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.idle-timeout=60000

# Configuración de Hibernate (JPA)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# CORS 
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5175}

# JWT 
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.cookie-name=${JWT_COOKIE_NAME:access_token}
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
app.jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:Lax}

# Green API (WhatsApp)
app.green-api.id-instance=${GREEN_API_ID_INSTANCE:}
app.green-api.api-token=${GREEN_API_TOKEN:}
app.green-api.api-url=${GREEN_API_URL:https://api.green-api.com}
app.green-api.media-url=${GREEN_API_MEDIA_URL:https://media.green-api.com}
app.green-api.default-country-code=${GREEN_API_DEFAULT_COUNTRY_CODE:51}
